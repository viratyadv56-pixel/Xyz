<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://hnmperzzheyzgibcdreb.supabase.co https://nametade.app.n8n.cloud; img-src data:; base-uri 'none'">
<title>XYZ Realty Owner Desk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Fraunces:opsz,wght@9..144,500;600&display=swap">
<style>
:root{
  --bg:#F3EEE4; --surface:#FBF8F1; --surface-2:#EEE7D9; --ink:#1E1A14; --ink-2:#5E5648; --ink-3:#8B8272;
  --line:#DDD3C1; --line-2:#CBBFA9;
  --accent:#A43B1C; --accent-2:#862F15; --accent-soft:#F3DDD3; --on-accent:#FFF8F2;
  --ok:#2B6A4C; --ok-soft:#DCEBDD; --warn:#8F5A06; --warn-soft:#F5E6C4; --bad:#A02626; --bad-soft:#F4D9D5; --info:#2B5C86; --info-soft:#D9E5EF;
  --shadow:0 1px 0 rgba(30,26,20,.04),0 10px 28px -14px rgba(30,26,20,.28);
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14110D; --surface:#1C1813; --surface-2:#262017; --ink:#F2ECDF; --ink-2:#B3A994; --ink-3:#877E6B;
    --line:#342E23; --line-2:#463E30;
    --accent:#E27A52; --accent-2:#EE8D68; --accent-soft:#3A2218; --on-accent:#1B0E08;
    --ok:#6CC49A; --ok-soft:#1B2E25; --warn:#E3B04F; --warn-soft:#352A12; --bad:#F08A80; --bad-soft:#3A1D1A; --info:#7FB2E0; --info-soft:#17283A;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14110D; --surface:#1C1813; --surface-2:#262017; --ink:#F2ECDF; --ink-2:#B3A994; --ink-3:#877E6B;
  --line:#342E23; --line-2:#463E30;
  --accent:#E27A52; --accent-2:#EE8D68; --accent-soft:#3A2218; --on-accent:#1B0E08;
  --ok:#6CC49A; --ok-soft:#1B2E25; --warn:#E3B04F; --warn-soft:#352A12; --bad:#F08A80; --bad-soft:#3A1D1A; --info:#7FB2E0; --info-soft:#17283A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.012em;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.mono{font-family:var(--f-mono);font-feature-settings:"tnum"}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{background:#B3261E;border-color:#B3261E;color:#fff}
.btn.danger:hover{background:#962019;border-color:#962019}
.btn.ghost{background:transparent}
.btn.ghost.danger-t{color:var(--bad);border-color:transparent}
.btn.ghost.danger-t:hover{background:var(--bad-soft)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.linklike{background:none;border:0;padding:0;font-weight:700;text-align:left;cursor:pointer;color:var(--ink);font-size:15px}
.linklike:hover{color:var(--accent);text-decoration:underline}
.inp,.sel,textarea.inp{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.inp:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp[readonly]{background:var(--surface-2);color:var(--ink-2)}
.sel{width:auto;min-height:34px;padding:4px 8px;font-size:13px;font-weight:600;cursor:pointer}
.sel.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sel.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.sel.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.sel.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.sel.neutral,.sel.muted{background:var(--surface-2);color:var(--ink-2);border-color:transparent}
select.sel option{background:var(--surface);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.span2{grid-column:1/-1}
@media (max-width:400px){.grid2{grid-template-columns:minmax(0,1fr)}}
.form-err{color:var(--bad);font-size:13.5px;font-weight:600;background:var(--bad-soft);padding:9px 12px;border-radius:9px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;min-height:42px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;line-height:1.6;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.muted{background:transparent;border:1px solid var(--line-2);color:var(--ink-3)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{position:relative;background:var(--accent);color:var(--on-accent);padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.login-art svg.plan{position:absolute;right:-6%;bottom:-4%;width:min(78%,520px);opacity:.34}
.login-art .tag{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.login-art h2{font-size:clamp(30px,4.2vw,54px);max-width:12ch;position:relative}
.login-card{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:clamp(24px,5vw,72px);padding-left:max(clamp(24px,5vw,72px),env(safe-area-inset-left,0px));padding-right:max(clamp(24px,5vw,72px),env(safe-area-inset-right,0px));max-width:560px;width:100%;margin:0 auto}
.login-card h1{font-size:32px}
.login-card form{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:46px}
.pw-wrap button{position:absolute;right:2px;top:1px}
.fine{font-size:12.5px;color:var(--ink-3)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.01em}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:18px;font-weight:600}
.login-art .mark{background:var(--on-accent);color:var(--accent)}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:1px}
@media (max-width:860px){
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{min-height:190px;padding:22px 20px}
  .login-art h2{font-size:26px;max-width:none}
  .login-art svg.plan{width:240px;right:-30px;bottom:-30px}
}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);z-index:40}
.side .brand{padding:0 8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.nav a[aria-current="page"] .badge{background:var(--accent);color:var(--on-accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 6px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-weight:700;color:var(--accent);flex:none}
.who-t{font-weight:700;font-size:14px}
.who-s{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;padding:30px clamp(16px,3.2vw,44px) 90px;padding-left:max(clamp(16px,3.2vw,44px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3.2vw,44px),env(safe-area-inset-right,0px))}
.topbar{display:none}
.scrim{display:none}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.vhead h1{font-size:clamp(26px,3.4vw,36px)}
.vhead .sub{color:var(--ink-2);margin-top:6px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.vtool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.vtool:empty{display:none}
.vtool .search{position:relative;flex:1 1 240px;max-width:420px}
.vtool .search .ic{position:absolute;left:12px;top:12px;color:var(--ink-3);pointer-events:none}
.vtool .search .inp{padding-left:38px}
.vtool .sel{min-height:42px;font-size:14px;background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);transform:translateX(-104%);transition:transform .22s ease;box-shadow:var(--shadow)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(20,16,10,.5);z-index:30}
  .topbar{display:flex;align-items:center;gap:8px;margin:-10px -6px 14px}
  .topbar .t{font-family:var(--f-display);font-weight:600;font-size:18px;flex:1}
  .main{padding-top:max(18px,env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- cards & lists ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card-h h3{font-size:18px}
.card-b{padding:14px 18px 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:16px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px}.stat .v{font-size:30px}.vhead .actions [data-action=refresh]{display:none}}
.stat{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em}
.stat .s{font-size:13px;color:var(--ink-3)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media (max-width:980px){.cols2{grid-template-columns:minmax(0,1fr)}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.click{cursor:pointer}
.item.click:hover{background:var(--surface-2)}
.item .c1{flex:2 1 210px;min-width:0}
.item .c2{flex:2 1 200px;min-width:0}
.item .c3{flex:0 1 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.item .c0{flex:0 0 74px}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.when-d{font-weight:700}
.when-t{font-size:13px;color:var(--ink-2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-display);font-size:19px;color:var(--ink);margin-bottom:4px}
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:500}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert .btn{margin-left:auto}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:150px;margin-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--accent)}
.bar i.z{background:var(--line)}
.bar .bv{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);height:14px}
.bar .bl{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.fun{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.fun-r{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.fun-t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fun-t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.fun-r .n{font-family:var(--f-mono);text-align:right;color:var(--ink-2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pcard.sold{opacity:.72}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard h3{font-size:19px;overflow-wrap:anywhere}
.pc-price{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.pc-price small{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-left:6px}
.pc-meta{font-size:13.5px;color:var(--ink-2)}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px}
.pc-foot{margin-top:auto;padding-top:8px;display:flex;justify-content:flex-end}
.speaker{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.speaker:last-child{border-bottom:0}
.speaker b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.speaker.ai b{color:var(--accent)}
.speaker span{overflow-wrap:anywhere;white-space:pre-wrap}
.tx{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--bg)}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 8px}
.mini{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mini>div{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.mini>div:last-child{border-bottom:0}
details.diff summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;margin-top:6px}
.diff-b{margin-top:8px;font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:3px;color:var(--ink-2);overflow-wrap:anywhere}
.diff-b s{color:var(--bad)}
.diff-b ins{color:var(--ok);text-decoration:none}
.sk{height:78px;border-radius:16px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite linear;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.set-grid .card-b{display:flex;flex-direction:column;gap:14px}
ul.plain{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:6px}

/* ---------- dialog ---------- */
dialog.dlg{padding:0;border:1px solid var(--line-2);border-radius:20px;background:var(--surface);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px -20px rgba(0,0,0,.55)}
dialog.dlg.wide{width:min(720px,calc(100vw - 24px))}
dialog.dlg[open]{display:flex}
dialog.dlg::backdrop{background:rgba(20,16,10,.58);backdrop-filter:blur(2px)}
.dlg-in{display:flex;flex-direction:column;min-width:0;width:100%;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px 22px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:21px;overflow-wrap:anywhere}
.dlg-b{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}

/* ---------- toast & idle ---------- */

.toast{padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .2s ease}
.toast.bad{background:#A32A22;color:#fff}

@keyframes up{from{transform:translateY(8px);opacity:0}}
.idle{position:fixed;left:0;right:0;top:0;z-index:300;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top,0px));background:#8F5A06;color:#fff;font-weight:700;text-align:center}

/* password re-check for destructive / sensitive actions */
async function verifyPassword(pw){
  var c = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'xyz-reauth'}});
  var r = await c.auth.signInWithPassword({email:state.user.email, password:pw});
  if (r.error || !r.data || !r.data.user) return false;
  var same = r.data.user.id === state.user.id;
  try { await c.auth.signOut({scope:'local'}); } catch(e){}
  return same;
}
function confirmWithPassword(o){
  return new Promise(function(resolve){
    var tries = 0, done = false;
    function finish(v){ if (!done) { done = true; resolve(v); } }
    var d = openDialog('<form class="dlg-in" autocomplete="off">'+dlgHead(o.title)+
      '<div class="dlg-b"><p>'+esc(o.message || '')+'</p><div class="lockline">'+ic('lock',16)+' Owner password dobara daalo</div>'+
      fld('Password','<input class="inp" type="password" name="pw" autocomplete="current-password" required data-focus>')+
      '<p class="form-err" role="alert" hidden></p></div>'+
      '<footer class="dlg-f"><button type="button" class="btn ghost" data-action="close-dlg">Cancel</button><button type="submit" class="btn '+(o.danger ? 'danger' : 'primary')+'">'+esc(o.confirmLabel || 'Confirm')+'</button></footer></form>',
      {onClose:function(){ finish(false); }});
    var form = d.querySelector('form');
    form.addEventListener('submit', async function(e){
      e.preventDefault(); formErr(form,''); var pw = form.elements.pw.value; if (!pw) return;
      setBusy(form, true);
      var ok = false; try { ok = await verifyPassword(pw); } catch(x){}
      setBusy(form, false);
      if (ok) { finish(true); d.close(); return; }
      tries++; form.elements.pw.value = '';
      if (tries >= 5) { finish(false); d.close(); doLogout('Bahut galat password attempts. Security ke liye logout kar diya.'); return; }
      formErr(form, 'Password galat hai. ('+(5-tries)+' try bache)');
    });
  });
}

async function onLogin(e){
  e.preventDefault(); var f = e.target; formErr(f,'');
  var now = Date.now(); if (now < lockUntil) { formErr(f, 'Bahut galat attempts. ' + Math.ceil((lockUntil-now)/1000) + ' second baad try karo.'); return; }

  var r = await sb.auth.signInWithPassword({email:email, password:password});

    setBusy(f, false); f.elements.password.value = ''; failCount++;
    if (failCount >= 5) { failCount = 0; lockUntil = Date.now() + 30000; formErr(f, 'Bahut galat attempts. 30 second ruko.'); return; }

  }
  failCount = 0;
  await enter(r.data.user);
}

async function loadAllInner(o){
  try {
    var res = await Promise.all([
      sb.from('leads').select('*').order('created_at',{ascending:false}).limit(2000),
      sb.from('properties').select('*').limit(1000),
      sb.from('site_visits').select('*').order('visit_at',{ascending:false}).limit(2000),
      sb.from('call_logs').select('id,lead_id,phone,direction,duration_secs,outcome,summary,elevenlabs_conversation_id,created_at').order('created_at',{ascending:false}).limit(500),
      sb.from('audit_log').select('*').order('at',{ascending:false}).limit(300)
    ]);
    if (!state.user) return;
    var bad = res.filter(function(r){ return r.error; })[0];
    if (bad) { if (isAuthErr(bad.error)) { doLogout('Session expire ho gaya. Dobara login karo.'); return; } state.err = friendly(bad.error); renderBody(); return; }
    state.leads = res[0].data || []; state.properties = res[1].data || []; state.visits = res[2].data || []; state.calls = res[3].data || []; state.audit = res[4].data || [];

function visitsFiltered(){

    if (f.range === 'stale' && !(v.status === 'scheduled' && t < now)) return false;
    if (f.range === 'past' && !(t < now)) return false;
    if (f.status && v.status !== f.status) return false;
    if (!q) return true; var l = leadById(v.lead_id), p = propById(v.property_id);
    return [l && l.name, l && l.phone, p && p.title, p && p.locality, v.notes].join(' ').toLowerCase().indexOf(q) >= 0;

  rows.sort(function(a,b){ var d = new Date(a.visit_at) - new Date(b.visit_at); return (f.range === 'upcoming' || f.range === 'stale') ? d : -d; });
  return rows;
}

    var m = /^([^:\n]{1,24}):\s*([\s\S]*)$/.exec(line); if (!m) return '<div class="speaker"><b></b><span>'+esc(line)+'</span></div>';
    var ai = /^(riya|agent|ai|assistant)$/i.test(m[1].trim());
    return '<div class="speaker'+(ai ? ' ai' : '')+'"><b>'+esc(m[1])+'</b><span>'+esc(m[2])+'</span></div>';
  }).join('');
}

/* ---- activity ---- */
function fmtVal(v){ if (v == null) return '∅'; var s = typeof v === 'object' ? JSON.stringify(v) : String(v); return s.length > 90 ? s.slice(0,90) + '…' : s; }
VIEWS.activity = {
  title:'Activity log',
  sub:function(){ return 'Kisne kya badla. Voice agent ke badlaav bhi yahin dikhte hain. Is log ko koi edit/delete nahi kar sakta.'; },
  toolbar:function(){ return '<select class="sel" data-filter="activity.table" aria-label="Table filter">'+opts(TABLE_LABEL, ui.activity.table, 'Sab')+'</select>'; },
  body:function(){
    if (!state.loadedAt) return '<div class="sk"></div><div class="sk"></div>';
    var rows = state.audit.filter(function(a){ return !ui.activity.table || a.table_name === ui.activity.table; });
    if (!rows.length) return '<div class="list"><div class="empty"><b>Abhi koi badlaav record nahi</b>Dashboard ya agent se jo bhi change hoga, yahan likha jayega.</div></div>';
    var tone = {insert:'ok', update:'info', delete:'bad'};
    return '<div class="list">' + rows.map(function(a){
      var who = a.actor_email ? esc(a.actor_email) : 'Voice agent / automation', diff = '';
      if (a.action === 'update' && a.new_data) {
        diff = Object.keys(a.new_data).map(function(k){ return '<div>'+esc(k)+': <s>'+esc(fmtVal(a.old_data && a.old_data[k]))+'</s> → <ins>'+esc(fmtVal(a.new_data[k]))+'</ins></div>'; }).join('');
      } else { var src = a.action === 'delete' ? a.old_data : a.new_data; if (src) diff = Object.keys(src).filter(function(k){ return k !== 'id' && src[k] != null && k !== 'created_at' && k !== 'updated_at'; }).slice(0,12).map(function(k){ return '<div>'+esc(k)+': '+esc(fmtVal(src[k]))+'</div>'; }).join(''); }
      return '<div class="item"><div class="c1"><div class="t">'+esc(a.summary || (TABLE_LABEL[a.table_name] || a.table_name))+'</div><div class="m">'+who+'</div>'+(diff ? '<details class="diff"><summary>Details</summary><div class="diff-b">'+diff+'</div></details>' : '')+'</div>'+
        '<div class="c3"><span class="chip muted">'+esc(TABLE_LABEL[a.table_name] || a.table_name)+'</span><span class="chip '+tone[a.action]+'">'+esc(a.action)+'</span></div><div class="c0 m" style="flex-basis:120px;text-align:right">'+esc(fmtDateTime(a.at))+'</div></div>';
    }).join('') + '</div>';
  }
};

/* ---- settings ---- */
VIEWS.settings = {
  title:'Settings',
  sub:function(){ return 'Account, password aur security. Koi bhi badlaav sirf login ke baad hi ho sakta hai.'; },
  body:function(){
    var th = lsGet('xyz-theme') || 'auto';
    return '<div class="set-grid">'+
      '<div class="card"><div class="card-h"><h3>Account</h3></div><div class="card-b"><div class="who"><span class="avatar">'+esc(initials((state.user.email||'O').split('@')[0]))+'</span><div style="min-width:0"><div class="who-t">Owner</div><div class="who-s" style="font-size:13px">'+esc(state.user.email)+'</div></div></div>'+
        '<p class="muted" style="font-size:14px">Session sirf is tab me chalta hai. Tab band = logout. 15 minute idle = auto-logout.</p>'+
        '<div class="actions"><button class="btn" data-action="logout">'+ic('logout',16)+' Logout</button><button class="btn" data-action="signout-all">Sab devices se logout</button></div></div></div>'+
      '<div class="card"><div class="card-h"><h3>Password badlo</h3></div><div class="card-b"><form id="pwForm" autocomplete="off" novalidate style="display:flex;flex-direction:column;gap:12px">'+
        fld('Abhi ka password','<input class="inp" type="password" name="cur" autocomplete="current-password" required>')+
        fld('Naya password','<input class="inp" type="password" name="np" autocomplete="new-password" minlength="10" required>', {hint:'Kam se kam 10 characters. Lambi phrase best hai.'})+
        fld('Naya password dobara','<input class="inp" type="password" name="np2" autocomplete="new-password" required>')+
        '<p class="form-err" role="alert" hidden></p><button type="submit" class="btn primary">Password update karo</button></form></div></div>'+
      '<div class="card"><div class="card-h"><h3>Theme</h3></div><div class="card-b"><div class="seg" role="group" aria-label="Theme">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(function(t){ return '<button type="button" data-action="set-theme" data-value="'+t[0]+'" aria-pressed="'+(th === t[0])+'">'+t[1]+'</button>'; }).join('')+'</div></div></div>'+
      '<div class="card"><div class="card-h"><h3>Security kaise kaam karti hai</h3></div><div class="card-b"><ul class="plain"><li>Database har request pe check karta hai ki login karne wala owner list me hai ya nahi. Bina login ya kisi aur account se data nahi milta.</li><li>Delete jaise bhaari kaam se pehle password dobara poocha jata hai.</li><li>Call logs read-only hain. Activity log me har badlaav likha jata hai aur use koi hata nahi sakta.</li></ul></div></div>'+
    '</div>';
  }
};
function bindSettings(){
  var f = $('#pwForm'); if (!f || f.dataset.bound) return; f.dataset.bound = '1';
  f.addEventListener('submit', async function(e){
    e.preventDefault(); formErr(f,''); var fe = f.elements;
    if (fe.np.value.length < 10) return formErr(f, 'Naya password kam se kam 10 characters ka ho.');
    if (fe.np.value !== fe.np2.value) return formErr(f, 'Dono naye password match nahi karte.');
    if (fe.np.value === fe.cur.value) return formErr(f, 'Naya password purane se alag ho.');
    setBusy(f, true);
    var ok = false; try { ok = await verifyPassword(fe.cur.value); } catch(x){}
    if (!ok) { setBusy(f,false); fe.cur.value = ''; return formErr(f, 'Abhi ka password galat hai.'); }
    var r = await sb.auth.updateUser({password:fe.np.value}); setBusy(f, false);
    if (r.error) return formErr(f, r.error.message);
    try { await sb.auth.signOut({scope:'others'}); } catch(x){}
    f.reset(); toast('Password badal gaya. Baaki devices logout ho gaye.', 'ok');
  });
}

/* ================= events ================= */
var ACTIONS = {
  go:function(el){ var v = el.dataset.view; if (location.hash === '#' + v) { ui.view = v; renderView(); document.body.classList.remove('nav-open'); } else location.hash = v; },
  'goto-stale':function(){ ui.visits.range = 'stale'; location.hash = 'visits'; if (ui.view === 'visits') renderView(); },
  'nav-open':function(){ document.body.classList.add('nav-open'); },
  'nav-close':function(){ document.body.classList.remove('nav-open'); },
  logout:function(){ doLogout('Logout ho gaya.'); },
  'signout-all':async function(){ await doLogout('Sab devices se logout ho gaya.', 'global'); },
  refresh:async function(){ await loadAll(); toast('Data refresh ho gaya.'); },
  'close-dlg':function(el){ var d = el.closest('dialog'); if (d) d.close(); },
  'set-filter':function(el){ setPath(ui, el.dataset.path, el.dataset.value); renderView(); },
  'set-theme':function(el){ lsSet('xyz-theme', el.dataset.value); applyTheme(el.dataset.value); renderBody(); bindSettings(); },
  'toggle-pw':function(el){ var i = el.parentNode.querySelector('input'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eyeoff' : 'eye'); },
  'lead-new':function(){ leadModal(null); }, 'lead-open':function(el){ leadModal(el.dataset.id); },
  'lead-call':function(el){ callLead(el.dataset.id); },
  'prop-new':function(){ propModal(null); }, 'prop-open':function(el){ propModal(el.dataset.id); },
  'visit-new':function(){ visitModal(null); }, 'visit-open':function(el){ visitModal(el.dataset.id); },
  'call-open':function(el){ callModal(el.dataset.id); },
  'lead-delete':async function(el){
    var id = el.dataset.id, l = leadById(id); if (!l) return; var nv = state.visits.filter(function(v){ return v.lead_id === id; }).length;
    var ok = await deleteRow('leads', id, {title:'Lead delete karna hai?', message:(l.name || fmtPhone(l.phone)) + ' ka lead delete hoga' + (nv ? ' aur iski ' + nv + ' site visit bhi hat jayengi' : '') + '. Call logs rahenge. Yeh wapas nahi aayega.'});
    if (ok) { var d = el.closest('dialog'); if (d) d.close(); }
  },
  'prop-delete':async function(el){
    var id = el.dataset.id, p = propById(id); if (!p) return;
    var ok = await deleteRow('properties', id, {title:'Property delete karni hai?', message:p.title + ' hamesha ke liye delete hogi. Isse jude visits rahenge par property "tay nahi" dikhegi. Bechni ho to "Sold" mark karo, delete nahi.'});
    if (ok) { var d = el.closest('dialog'); if (d) d.close(); }
  },
  'visit-delete':async function(el){
    var id = el.dataset.id;
    var ok = await deleteRow('site_visits', id, {title:'Visit delete karni hai?', message:'Yeh visit hamesha ke liye hat jayegi. Sirf cancel karna ho to status "Cancelled" kar do.'});
    if (ok) { var d = el.closest('dialog'); if (d) d.close(); }
  }
};
var CHANGES = {
  'lead-status':function(el){ var p = {status:el.value}; if (el.value === 'do_not_call') p.consent_to_call = false; patchRow('leads', state.leads, el.dataset.id, p, 'Lead status update ho gaya.'); },
  'lead-consent':function(el){
    var l = leadById(el.dataset.id); if (el.checked && l && l.status === 'do_not_call') { el.checked = false; toast('Yeh lead "Do not call" hai. Pehle status badlo.', 'bad'); return; }
    patchRow('leads', state.leads, el.dataset.id, {consent_to_call:el.checked}, el.checked ? 'Call consent on.' : 'Call consent off.');
  },
  'prop-status':function(el){ patchRow('properties', state.properties, el.dataset.id, {status:el.value}, 'Property status update ho gaya.'); },
  'visit-status':function(el){ patchRow('site_visits', state.visits, el.dataset.id, {status:el.value}, 'Visit status update ho gaya.'); }
};
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]'); if (!el) return; var fn = ACTIONS[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('#nav a')) { e.preventDefault(); ACTIONS.go(e.target); }
});
document.addEventListener('change', function(e){ var el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el); });
document.addEventListener('input', function(e){ var el = e.target.closest('[data-filter]'); if (el) { setPath(ui, el.dataset.filter, el.value); renderBody(); } });

/* ================= boot ================= */
(async function boot(){
  var r = await sb.auth.getSession();
  if (r.data && r.data.session) { var ok = await enter(r.data.session.user); if (!ok) return; }
  else showLogin();
})();

})();
</script>
